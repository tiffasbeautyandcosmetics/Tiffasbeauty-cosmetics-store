<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIFFAS Admin</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f3fb;color:#24152d}.top{padding:18px 22px;background:#6d1b7b;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:20px}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;box-shadow:0 5px 20px #0001;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid input,.grid select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#8e2a9d;color:#fff}.dark{background:#23102b;color:#fff}.light{background:#eee;color:#2a1532}.danger{background:#b42318;color:#fff}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}.table th{background:#faf7fb}.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#eee}.small{font-size:12px;color:#6d6172}.hidden{display:none}.status{padding:10px;border-radius:8px;background:#f2e8f4;margin-top:10px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.modalbox{max-width:650px;width:100%;background:#fff;border-radius:15px;padding:20px}.actions{display:flex;gap:7px;flex-wrap:wrap}.search{max-width:420px}.preview{width:120px;height:120px;border-radius:12px;object-fit:cover;background:#eee} @media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.table{font-size:13px}.table th:nth-child(4),.table td:nth-child(4){display:none}} @media(max-width:550px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head>
<body><div class="top"><h1>TIFFAS BEAUTY & COSMETICS — Admin</h1><button class="btn light" id="logout">Lock</button></div><div class="wrap">
<div class="card" id="loginCard"><h2>Admin access</h2><p class="small">Enter the Render admin token. Never share your token publicly.</p><input id="token" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:8px" type="password" placeholder="Admin token"><div style="margin-top:10px"><button class="btn primary" id="login">Open catalogue</button></div><div id="loginStatus" class="status hidden"></div></div>
<div id="app" class="hidden"><div class="card"><div class="toolbar"><button class="btn primary" id="add">+ Add product</button><button class="btn dark" id="save">Save to backend</button><button class="btn light" id="export">Download JSON</button><button class="btn light" id="importBtn">Import JSON</button><button class="btn light" id="reset">Reload backend catalogue</button><input id="search" class="search" placeholder="Search products..."><input id="file" type="file" accept="application/json" class="hidden"></div><div id="status" class="status">Loading…</div></div>
<div class="card"><div style="overflow:auto"><table class="table"><thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Qty</th><th>In stock</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="mtitle">Edit product</h2><div class="grid"><label>Name<input id="mname"></label><label>Category<input id="mcat"></label><label>Price<input id="mprice" type="number" step="0.01"></label><label>Stock qty<input id="mqty" type="number" step="1"></label></div><div style="margin-top:12px"><label><input id="mstock" type="checkbox"> In stock</label></div><div style="margin-top:12px"><label>Picture file<input id="mfile" type="file" accept="image/*"></label><div style="margin-top:10px"><img id="preview" class="preview" alt="preview"></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" id="msave">Save changes</button><button class="btn light" id="mcancel">Cancel</button></div></div></div>
<script>const API=location.origin;let products=[],editing=-1,token=localStorage.getItem('tiffas_admin_token')||'';const $=id=>document.getElementById(id);function setStatus(t,err=false){$('status').textContent=t;$('status').style.background=err?'#fdecec':'#f2e8f4'}function slug(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'product'}function uniqueId(name,index=-1){let id=slug(name),base=id,n=2;while(products.some((p,i)=>i!==index&&p.id===id))id=base+'-'+n++;return id}function draw(){let q=$('search').value.toLowerCase();let list=products.map((p,i)=>({p,i})).filter(x=>(x.p.name||'').toLowerCase().includes(q)||(x.p.category||'').toLowerCase().includes(q));$('rows').innerHTML=list.map(({p,i})=>`<tr><td>${p.image?`<img class="thumb" src="${p.image}" alt="">`:'—'}</td><td>${p.name||''}</td><td>${p.category||''}</td><td>Ksh ${Number(p.price||0).toLocaleString('en-KE')}</td><td>${p.stockQty??0}</td><td>${p.inStock?'Yes':'No'}</td><td><div class="actions"><button class="btn light" data-e="${i}">Edit</button><button class="btn danger" data-d="${i}">Delete</button></div></td></tr>`).join('');setStatus(`${list.length} shown / ${products.length} products`)}async function load(){try{let r=await fetch(API+'/api/products?v=admin');if(!r.ok)throw Error('Could not load catalogue');products=await r.json();if(!Array.isArray(products))products=[];draw();try{let s=await fetch(API+'/api/admin/storage',{headers:{'x-admin-token':token}});let d=await s.json();if(d.persistent)setStatus(`${d.catalogCount} products • PostgreSQL persistence active`);else setStatus(`${d.catalogCount} products • PostgreSQL persistence not connected`,true)}catch(_){}}catch(e){setStatus(e.message,true)}}function openModal(i=-1){editing=i;let p=i>=0?products[i]:{name:'',category:'Beauty & Cosmetics',price:0,stockQty:0,inStock:true,image:null};$('mtitle').textContent=i>=0?'Edit product':'Add product';$('mname').value=p.name||'';$('mcat').value=p.category||'Beauty & Cosmetics';$('mprice').value=p.price??0;$('mqty').value=p.stockQty??0;$('mstock').checked=!!p.inStock;$('preview').src=p.image||'';$('mfile').value='';$('modal').classList.add('open')}function close(){ $('modal').classList.remove('open') }$('login').onclick=()=>{token=$('token').value.trim();if(!token)return $('loginStatus').textContent='Enter the admin token.';localStorage.setItem('tiffas_admin_token',token);$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');load()};if(token){$('token').value=token;$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');load()}$('logout').onclick=()=>{localStorage.removeItem('tiffas_admin_token');location.reload()};$('search').oninput=draw;$('add').onclick=()=>openModal(-1);$('mcancel').onclick=close;$('rows').onclick=e=>{let ed=e.target.closest('[data-e]'),del=e.target.closest('[data-d]');if(ed)openModal(Number(ed.dataset.e));if(del){let i=Number(del.dataset.d);if(confirm('Delete this product?')){products.splice(i,1);draw()}}};$('mfile').onchange=()=>{let f=$('mfile').files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{$('preview').src=rd.result};rd.readAsDataURL(f)};$('msave').onclick=()=>{let name=$('mname').value.trim();if(!name)return alert('Product name is required');let p=editing>=0?products[editing]:{id:'',image:null};p.name=name;p.id=uniqueId(name,editing);p.category=$('mcat').value.trim()||'Beauty & Cosmetics';p.price=Number($('mprice').value||0);p.stockQty=Number($('mqty').value||0);p.inStock=$('mstock').checked;p.image=$('preview').src||null;if(editing<0)products.unshift(p);close();draw()};$('save').onclick=async()=>{if(!token)return alert('Admin token required');setStatus('Saving…');try{let r=await fetch(API+'/api/admin/products',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-token':token},body:JSON.stringify({products})});let d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Save failed');setStatus(`Saved ${d.count} products. Storefront and admin now use the same backend catalogue.`);load()}catch(e){setStatus(e.message,true)}};$('reset').onclick=load;$('export').onclick=()=>{let blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tiffas-products.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('file').click();$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!Array.isArray(d))throw Error('JSON must contain an array');products=d;draw()}catch(e){alert(e.message)}};rd.readAsText(f)};</script></body></html>
